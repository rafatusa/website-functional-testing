name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Validate config.yaml
      run: npm run validate:config
    - name: TypeScript type check
      run: npm run typecheck
  provision:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers with OS dependencies
      run: npx playwright install --with-deps chromium webkit
    - name: Report prepared environment
      run: npm run report:env
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers with OS dependencies
      run: npx playwright install --with-deps chromium webkit
    - id: run_tests
      name: Launch browsers and execute functional tests
      run: npm run test:functional
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Generate execution summary and pass/fail statistics
      run: npm run report:summary
    - name: Publish summary to job summary
      run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload Playwright HTML report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: reports/html
        retention-days: 30
